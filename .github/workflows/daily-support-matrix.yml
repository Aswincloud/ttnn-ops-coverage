name: Daily eltwise support matrix (tt-metal)

# Drives a Tenstorrent eltwise support-probe run end to end, unattended:
#   rebase our tt-metal branch on upstream main -> dispatch ONE test-dispatch
#   run that fans out to 2 boards x 10 shards off a single build -> poll it to
#   completion -> download the 20 raw shard CSVs and merge each board's 10 shards
#   locally (tt-metal uploads raw shards; we do the merge) -> land each as the
#   board's root eltwise_support_matrix_<board>.csv (the dashboard source) + a
#   dated history/workflow/ copy, via one auto-merging PR.
#
# The tt-metal calls need push/workflow access to tenstorrent/tt-metal, which
# this repo's GITHUB_TOKEN/App does not have, so they use the TT_METAL_PAT
# secret (Aswinmcw's classic PAT, repo+workflow scopes).

on:
  schedule:
    # 20:00 UTC = 01:30 IST — staggered 30 min after the perf pipeline's 19:30
    # UTC run so the two don't contend for the same shared viommu HW pool. Runs
    # the prior UTC day, but the guard step dates the file in IST, so the
    # dashboard shows the correct IST run day (not the previous UTC day).
    - cron: "0 20 * * *"     # MAIN run.
    - cron: "45 23 * * *"    # SAFETY-NET. ~3.75h after the main run, by which
    # the tt-metal run (queue + ~3h exec) has finished. If the main run got
    # cancelled/killed before ingesting (e.g. a hosted-runner SIGTERM mid-poll,
    # while the tt-metal run itself succeeded), this pass detects the missing day
    # and ingests the newest successful tt-metal run instead of re-dispatching.
    # No-op (silent) when today's data already landed. Staggered 15 min after the
    # perf safety-net (23:30) so the two don't contend for the API/HW pool.
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = rebase+dispatch+poll+ingest; recover = skip all that and just ingest an already-completed tt-metal run"
        type: choice
        options: [normal, recover]
        default: normal
      run_id:
        description: "recover only: tt-metal test-dispatch run id to ingest (blank = newest successful run on the branch)"
        required: false
        default: ""

# Never cancel an in-flight run: it owns viommu hardware jobs on tt-metal's
# shared pool, and a scheduled run must not orphan them.
concurrency:
  group: daily-support-matrix
  cancel-in-progress: false

permissions:
  contents: read
  issues: write            # GITHUB_TOKEN files/dedupes failure & conflict issues

env:
  OUR_REPO: Aswincloud/ttnn-ops-coverage
  TT_REPO: tenstorrent/tt-metal
  TT_BRANCH: Aswinmcw/test_eltwise_support
  RAW_BASE: https://raw.githubusercontent.com/Aswincloud/ttnn-ops-coverage/main
  # The tt-metal matrix is board-only; each board yields an artifact
  # eltwise-support-matrix-<HW> that becomes eltwise_support_matrix_<hw>.csv.
  BOARDS: "N150 P100a"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # < GitHub's hard 6h (360m) hosted-runner cap; the
                           # poll deadline itself is 5.5h (see DEADLINE below)
    steps:
      # 0. Checkout our repo (commit base) + compute the run date.
      - name: Checkout coverage repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Don't persist GITHUB_TOKEN as a git http.extraheader: it would
          # override the App token we embed in the push URL for the result PR
          # (git applies the extraheader to any github.com push), causing a 403
          # as github-actions[bot]. All steps here authenticate explicitly.
          persist-credentials: false

      # 0a. Classify this invocation: normal (main cron / manual normal),
      #     recover (manual mode=recover), or safety-net (the 23:45 UTC cron).
      #     The two crons are told apart by github.event.schedule.
      - name: Detect mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "45 23 * * *" ]; then
            MODE=safety-net
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "${INPUT_MODE:-normal}" = "recover" ]; then
            MODE=recover
          else
            MODE=normal
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "🧭 mode=$MODE (event=$EVENT schedule='${SCHEDULE:-}' input='${INPUT_MODE:-}')"

      - name: Compute run date
        id: guard
        run: |
          set -euo pipefail
          # No idempotency skip: result filenames are timestamped and land in
          # per-board subdirs, so a same-day re-run never collides.
          # IST, not UTC: the cron is 1:30 AM IST (20:00 UTC of the prior day).
          # The dashboard's data day is parsed straight from this filename prefix
          # (process.py::_date_from), so a UTC date would label every snapshot the
          # previous day. Use Asia/Kolkata so the history CSV is dated the IST run
          # day. (The 'generated'/'generatedUTC' fields stay honest build-time UTC.)
          # NOTE: recover/safety-net override this at commit time from the tt-metal
          # run's createdAt→IST (the CSV carries NO date column, so it can't be
          # reconstructed from the data); this value is the normal-mode date and
          # the safety-net gap-check's "today (IST)".
          echo "date=$(TZ='Asia/Kolkata' date +%F)" >> "$GITHUB_OUTPUT"

      # 0b. Safety-net only: if today's data already landed, stop here (silent
      #     success). The dashboard day is the history filename prefix, so a
      #     present dated history CSV for the primary board means the day was
      #     ingested. Emits present=true|false.
      - name: Safety-net gap check
        id: gap
        if: steps.mode.outputs.mode == 'safety-net'
        env:
          DATE: ${{ steps.guard.outputs.date }}
        run: |
          set -euo pipefail
          if [ -f "history/workflow/eltwise_support_matrix_n150_${DATE}.csv" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "✅ ${DATE} data already present — safety-net has nothing to do."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ ${DATE} data missing — safety-net will ingest the newest successful tt-metal run."
          fi

      # 0c. Collapse mode + gap into two booleans every later step gates on:
      #       dispatch — rebase + dispatch + poll (normal only).
      #       ingest   — resolve + download + merge + commit (normal & recover
      #                  always; safety-net only when today's data is missing).
      - name: Plan run
        id: plan
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          GAP_PRESENT: ${{ steps.gap.outputs.present }}
        run: |
          set -euo pipefail
          case "$MODE" in
            normal)  DISPATCH=true;  INGEST=true ;;
            recover) DISPATCH=false; INGEST=true ;;
            safety-net)
              DISPATCH=false
              if [ "$GAP_PRESENT" = "false" ]; then INGEST=true; else INGEST=false; fi ;;
            *) DISPATCH=true; INGEST=true ;;
          esac
          echo "dispatch=$DISPATCH" >> "$GITHUB_OUTPUT"
          echo "ingest=$INGEST"     >> "$GITHUB_OUTPUT"
          echo "🧭 plan: dispatch=$DISPATCH ingest=$INGEST (mode=$MODE gap_present='${GAP_PRESENT:-}')"

      # 1. Rebase the tt-metal branch onto upstream main so its build tooling
      #    (build-artifact.yaml etc.) stays current. Conflict => file an issue,
      #    do NOT dispatch.
      - name: Rebase tt-metal branch on main
        if: steps.plan.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.TT_METAL_PAT }}
        run: |
          set -euo pipefail
          git config --global user.name "Aswinmcw"
          git config --global user.email "aswin@aswincloud.com"
          AUTH="https://x-access-token:${GH_TOKEN}@github.com/${TT_REPO}.git"
          # FULL clone — deliberately NOT --filter=blob:none. A blobless partial
          # clone defers blob downloads, so `git rebase` has to lazily fetch
          # objects mid-operation over the network. On 2026-08-17/18 that fetch
          # failed in BOTH daily pipelines with
          #     fatal: remote error: upload-pack: not our ref <blob sha>
          # (the blobs exist and the REST API serves them; upload-pack refused
          # them on the promisor fetch), taking the runs down for two days. A
          # full clone of tt-metal is ~1.5 GB — well under a minute on a hosted
          # runner — and makes the rebase a purely LOCAL operation that cannot
          # fail this way.
          git clone --no-checkout "$AUTH" ttm
          cd ttm
          # Record the branch's current remote SHA up front as the exact lease
          # expectation. In a fresh clone the remote-tracking ref state is
          # unreliable for a bare --force-with-lease (it rejects with
          # "stale info" after the local rebase), so we pin the lease to this SHA.
          REMOTE_SHA=$(git ls-remote "$AUTH" "refs/heads/${TT_BRANCH}" | cut -f1)
          echo "Branch remote SHA before rebase: ${REMOTE_SHA:-<none>}"
          git fetch --no-tags origin main "${TT_BRANCH}"
          git checkout -B "${TT_BRANCH}" "${REMOTE_SHA}"
          # Tell a REAL content conflict apart from a transport/other failure.
          # Previously any non-zero `git rebase` exit was labelled
          # rebase-conflict, so the 08-17/18 fetch outage above alerted us with
          # "resolve the conflict manually" for a conflict that did not exist —
          # the misdiagnosis cost more than the outage. Unmerged paths exist
          # only for a genuine conflict, so use them as the discriminator.
          if ! REBASE_OUT=$(git rebase origin/main 2>&1); then
            echo "$REBASE_OUT"
            CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            if [ -n "${CONFLICTS// /}" ]; then
              KIND=rebase-conflict
              MSG="tt-metal branch rebase hit a real content conflict with origin/main (files: ${CONFLICTS})"
            else
              KIND=rebase-failed
              MSG="git rebase failed with NO conflicting files — transport/clone error, not a merge conflict"
            fi
            git rebase --abort || true
            # $GITHUB_ENV is line-oriented: flatten git's output to one line.
            TAIL=$(printf '%s' "$REBASE_OUT" | tail -3 | tr '\n' ' ')
            echo "FAIL_KIND=$KIND" >> "$GITHUB_ENV"
            echo "FAIL_DETAIL=${MSG}. git said: ${TAIL}" >> "$GITHUB_ENV"
            echo "::error::${MSG}; not dispatching."
            exit 1
          fi
          # Lease pinned to the SHA we read: still aborts if someone else pushed
          # in between (their push would change the ref off REMOTE_SHA), but works
          # reliably in a fresh clone. No-op rebase pushes the same SHA harmlessly.
          if ! git push --force-with-lease="${TT_BRANCH}:${REMOTE_SHA}" "$AUTH" "HEAD:${TT_BRANCH}"; then
            echo "FAIL_KIND=rebase-push-failed" >> "$GITHUB_ENV"
            echo "::error::Rebase succeeded but push was rejected (branch moved underneath us?)."
            exit 1
          fi
          echo "✅ Rebased ${TT_BRANCH} on origin/main and pushed."

      # 2. Dispatch the sharded support probe on tt-metal + correlate the run.
      #    ONE run fans out to 2 boards x 10 shards off a single build.
      - name: Dispatch tt-metal support run
        id: dispatch
        if: steps.plan.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.TT_METAL_PAT }}
        run: |
          set -euo pipefail
          # Snapshot the existing test-dispatch runs on our branch BEFORE
          # dispatching, so we can identify the exact new run we create rather
          # than trusting "newest after a timestamp" (which could latch onto a
          # concurrent manual dispatch or a rerun on the same branch).
          list_runs() {
            gh run list -R "$TT_REPO" -w test-dispatch.yaml -e workflow_dispatch \
              -b "$TT_BRANCH" -L 100 --json databaseId -q '.[].databaseId' 2>/dev/null || true
          }
          BEFORE_IDS=$(list_runs | sort -u)
          # $SHARD / $SHARD_TOTAL are expanded by tt-metal's shard matrix at
          # runtime, so they are single-quoted here (no expansion on our runner).
          # The probe imports torch (a wheel dep, usually already present) — the
          # install is a harmless safety net. --out names the per-shard CSV the
          # tt-metal workflow uploads as an artifact; we merge the shards locally
          # (step 4) rather than in a tt-metal combine job.
          CMD='set -euo pipefail
          uv pip install torch
          curl -fsSL '"${RAW_BASE}"'/eltwise_support_probe.py -o /work/eltwise_support_probe.py
          cd /work && python eltwise_support_probe.py --shard "$SHARD/$SHARD_TOTAL" --out "shard-$SHARD.csv"'

          # The board list (N150/P100a) and their viommu labels + arch are fixed
          # in the tt-metal branch's matrix, so arch/runner-label inputs are
          # ignored — but the schema still marks them required, so pass
          # placeholders. The support probe needs no profiler -> tracy=false.
          # Leave 'description' and 'commit' at their defaults (do NOT set them).
          gh workflow run test-dispatch.yaml -R "$TT_REPO" --ref "$TT_BRANCH" \
            -f arch=wormhole_b0 \
            -f 'runner-label=["tt-ubuntu-2204-N150-viommu-stable"]' \
            -f tracy=false \
            -f command="$CMD"

          # gh workflow run returns no id. Poll for run IDs that are NEW since
          # our pre-dispatch snapshot (set difference). Exactly one new run is
          # expected; if two or more appear we can't attribute the artifacts
          # safely, so fail loudly rather than commit someone else's data.
          RUN_ID=""
          for i in $(seq 1 18); do
            NEW_IDS=$(comm -13 <(printf '%s\n' "$BEFORE_IDS") <(list_runs | sort -u) | grep -v '^$' || true)
            COUNT=$(printf '%s\n' "$NEW_IDS" | grep -c . || true)
            if [ "$COUNT" -ge 2 ]; then
              echo "FAIL_KIND=dispatch-ambiguous" >> "$GITHUB_ENV"
              echo "FAIL_DETAIL=multiple new runs on ${TT_BRANCH}: $(printf '%s ' $NEW_IDS)" >> "$GITHUB_ENV"
              echo "::error::Multiple new test-dispatch runs appeared on ${TT_BRANCH}; cannot attribute ours: $(printf '%s ' $NEW_IDS)"
              exit 1
            fi
            if [ "$COUNT" -eq 1 ]; then RUN_ID="$NEW_IDS"; break; fi
            sleep 10
          done
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "FAIL_KIND=dispatch-not-found" >> "$GITHUB_ENV"
            echo "::error::Dispatched but could not locate the tt-metal run."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "🚀 tt-metal run: https://github.com/${TT_REPO}/actions/runs/${RUN_ID}"

      # 2b. Resolve the tt-metal run id every ingest mode acts on, so Poll/Download
      #     /Slack never depend on the (skipped) Dispatch step. normal = the just-
      #     dispatched run; recover = the run_id input or newest SUCCESSFUL run;
      #     safety-net = newest successful run. recover/safety-net SKIP Poll (and
      #     its CONCL==success gate), so re-validate the resolved run here.
      - name: Resolve tt-metal run
        id: resolve
        if: steps.plan.outputs.ingest == 'true'
        env:
          GH_TOKEN: ${{ secrets.TT_METAL_PAT }}
          MODE: ${{ steps.mode.outputs.mode }}
          INPUT_RUN_ID: ${{ github.event.inputs.run_id }}
          DISPATCH_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "normal" ]; then
            RID="$DISPATCH_RUN_ID"
          else
            RID="${INPUT_RUN_ID:-}"
            if [ -n "$RID" ]; then
              echo "Using operator-supplied run id: $RID"
            else
              RID=$(gh run list -R "$TT_REPO" -w test-dispatch.yaml -e workflow_dispatch \
                      -b "$TT_BRANCH" --status success -L 20 \
                      --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
              echo "Auto-resolved newest successful run: ${RID:-<none>}"
            fi
            if [ -z "$RID" ] || [ "$RID" = "null" ]; then
              echo "FAIL_KIND=resolve-run-not-found" >> "$GITHUB_ENV"
              echo "::error::Could not resolve a tt-metal run to ingest (no successful run on ${TT_BRANCH}, and none supplied)."
              exit 1
            fi
            SC=$(gh run view "$RID" -R "$TT_REPO" --json status,conclusion \
                   -q '.status + "|" + (.conclusion // "")' 2>/dev/null || echo "|")
            ST="${SC%%|*}"; CO="${SC##*|}"
            echo "Resolved run $RID → status=$ST conclusion=$CO"
            if [ "$ST" != "completed" ] || [ "$CO" != "success" ]; then
              echo "FAIL_KIND=recover-run-not-successful" >> "$GITHUB_ENV"
              echo "FAIL_DETAIL=run $RID is status=$ST conclusion=$CO (need completed/success)" >> "$GITHUB_ENV"
              echo "::error::Resolved tt-metal run $RID is not completed/successful ($ST/$CO)."
              exit 1
            fi
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "📌 ingest target: https://github.com/${TT_REPO}/actions/runs/${RID}"

      # 3. Poll the tt-metal run to completion. Skipped in recover/safety-net —
      #    the resolved run has already completed.
      - name: Poll tt-metal run
        if: steps.plan.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.TT_METAL_PAT }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.resolve.outputs.run_id }}"
          # 5.5h, not 6h: a hosted job is hard-killed at GitHub's 6h (360m) cap,
          # and ~15m around this poll goes to dispatch + download/merge/PR, so a
          # literal 6h poll could never finish. 5.5h (330m) is the largest budget
          # that still lets THIS clean poll-timeout fire before GitHub's generic
          # kill, while covering the tt-metal dispatch->complete times now drifting
          # past 4h (queue + ~3h exec on the shared HW pool).
          DEADLINE=$(( $(date +%s) + 330*60 ))   # 5.5h
          ERRS=0                                  # consecutive failed polls
          MAX_ERRS=20                             # ~30 min of solid API failures
          ERRLOG=$(mktemp)                        # captured stderr of the last poll
          RETRIES_LEFT=1                          # re-run failed tt-metal jobs at most once
          CONCL=""
          while :; do
            # A single flaky `gh run view` (GitHub API 500 / Connect-Timeout) must
            # NOT abort the whole daily run — under set -e it used to, ending the
            # poll while the tt-metal run was still queued (and the data was fine).
            # Guard the call: on failure treat this tick as "unknown, keep waiting"
            # and only give up after MAX_ERRS consecutive failures (a real outage /
            # bad token), not one blip. Capture stderr (don't discard it) so the
            # actual cause — auth / rate-limit / network — shows in the log and the
            # final error, which matters for triage.
            if S=$(gh run view "$RUN_ID" -R "$TT_REPO" --json status,conclusion \
                     -q '.status + "|" + (.conclusion // "")' 2>"$ERRLOG"); then
              ERRS=0
              STATUS="${S%%|*}"; CONCL="${S##*|}"
              echo "$(date -u +%T) status=$STATUS conclusion=$CONCL"
              if [ "$STATUS" = "completed" ]; then
                [ "$CONCL" = "success" ] && break
                # The run is all-or-nothing, so ONE flaky cell (a HW blip, a
                # runner reclaim) throws away a full day of otherwise-good data.
                # Re-run just the failed jobs once. Safe because re-running only
                # the failed jobs PRESERVES the successful cells' artifacts
                # (verified on run 32662117793: 19 attempt-1 shard artifacts
                # survived the retry), so the run still yields every shard.
                #
                # Only retry a PARTIAL failure — some cells passed AND some
                # failed. A build-phase break leaves zero passing cells and will
                # not fix itself, so that still fails fast with the real reason
                # instead of burning ~12 min on a doomed rebuild.
                CELLS=$(gh run view "$RUN_ID" -R "$TT_REPO" --json jobs \
                          -q '[.jobs[]|select(.name|test("test-dispatch"))]
                              | "\([.[]|select(.conclusion=="success")]|length) \([.[]|select(.conclusion!="success")]|length)"' \
                          2>/dev/null || echo "0 0")
                OK_CELLS="${CELLS%% *}"; BAD_CELLS="${CELLS##* }"
                case "${OK_CELLS}${BAD_CELLS}" in *[!0-9]*) OK_CELLS=0; BAD_CELLS=0 ;; esac
                echo "tt-metal run concluded '$CONCL' — cells: ${OK_CELLS} ok / ${BAD_CELLS} failed"
                if [ "$RETRIES_LEFT" -gt 0 ] && [ "$OK_CELLS" -gt 0 ] && [ "$BAD_CELLS" -gt 0 ]; then
                  RETRIES_LEFT=$(( RETRIES_LEFT - 1 ))
                  ATTEMPT_BEFORE=$(gh api "repos/${TT_REPO}/actions/runs/${RUN_ID}" -q .run_attempt 2>/dev/null || echo 1)
                  echo "::notice::Partial failure (${BAD_CELLS} of $(( OK_CELLS + BAD_CELLS )) cells) — re-running failed jobs once."
                  if ! gh run rerun "$RUN_ID" -R "$TT_REPO" --failed 2>"$ERRLOG"; then
                    echo "FAIL_KIND=tt-run-failed" >> "$GITHUB_ENV"
                    echo "FAIL_DETAIL=partial failure (${BAD_CELLS} cells) and the retry could not be started: $(tr '\n' ' ' <"$ERRLOG" | cut -c1-200)" >> "$GITHUB_ENV"
                    echo "::error::Could not re-run the tt-metal run's failed jobs."
                    exit 1
                  fi
                  # The API keeps reporting completed/<old conclusion> for a few
                  # seconds after a rerun is accepted; resuming the poll straight
                  # away would read that stale value and declare failure. Wait for
                  # the attempt counter to tick over first.
                  NOW_ATTEMPT="$ATTEMPT_BEFORE"
                  for _ in $(seq 1 20); do
                    sleep 15
                    NOW_ATTEMPT=$(gh api "repos/${TT_REPO}/actions/runs/${RUN_ID}" -q .run_attempt 2>/dev/null || echo "$ATTEMPT_BEFORE")
                    [ "$NOW_ATTEMPT" -gt "$ATTEMPT_BEFORE" ] && break
                  done
                  echo "Retry started (attempt ${NOW_ATTEMPT}) — resuming poll."
                  continue
                fi
                RETRY_NOTE=""
                [ "$RETRIES_LEFT" -eq 0 ] && RETRY_NOTE=" (failed jobs were already re-run once)"
                echo "FAIL_KIND=tt-run-failed" >> "$GITHUB_ENV"
                echo "FAIL_DETAIL=tt-metal run concluded '$CONCL'${RETRY_NOTE} — ${OK_CELLS} ok / ${BAD_CELLS} failed cells (https://github.com/${TT_REPO}/actions/runs/${RUN_ID})" >> "$GITHUB_ENV"
                echo "::error::tt-metal run concluded '$CONCL' (all-or-nothing: no data landed)${RETRY_NOTE}."
                exit 1
              fi
            else
              ERRS=$(( ERRS + 1 ))
              ERRMSG=$(tr '\n' ' ' <"$ERRLOG" | sed 's/  */ /g'; :)
              echo "$(date -u +%T) poll error (${ERRS}/${MAX_ERRS}) — transient, retrying: ${ERRMSG}"
              if [ "$ERRS" -ge "$MAX_ERRS" ]; then
                echo "FAIL_KIND=poll-api-error" >> "$GITHUB_ENV"
                echo "FAIL_DETAIL=last API error: $(printf '%s' "$ERRMSG" | cut -c1-300)" >> "$GITHUB_ENV"
                echo "::error::gh run view kept failing (${ERRS} consecutive) — GitHub API outage or bad token. Last error: ${ERRMSG}"
                exit 1
              fi
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "FAIL_KIND=poll-timeout" >> "$GITHUB_ENV"
              echo "::error::tt-metal run did not complete within 5.5h."
              exit 1
            fi
            sleep 90
          done

      # 4. Download the 20 per-board SHARD CSVs and merge each board's 10 shards
      #    locally. tt-metal only produces raw shards now — the merge lives HERE,
      #    using the eltwise_support_probe.py already checked out in this repo (no
      #    raw.githubusercontent curl -> no 429 that a parallel-combine job on
      #    tt-metal used to hit). --merge is a device-free stdlib post-process; its
      #    --out writes exactly the eltwise_support_matrix.csv the commit step reads.
      - name: Download shards + merge results
        id: download
        if: steps.plan.outputs.ingest == 'true'
        env:
          GH_TOKEN: ${{ secrets.TT_METAL_PAT }}
        run: |
          set -euo pipefail
          RUN_ID="${{ steps.resolve.outputs.run_id }}"
          for HW in $BOARDS; do
            mkdir -p "_artifact/${HW}/shards"
            # One call grabs all 10 shard artifacts for this board; the trailing
            # "-" + glob keeps N150 and P100a shards separate (…-N150-* matches
            # …-N150-1 … …-N150-10, not the other board). Each extracts into its
            # own subdir, so glob recursively.
            gh run download "$RUN_ID" -R "$TT_REPO" \
              -p "eltwise-support-shard-${HW}-*" -D "_artifact/${HW}/shards"
            mapfile -t SHARDS < <(find "_artifact/${HW}/shards" -name 'shard-*.csv' | sort)
            if [ "${#SHARDS[@]}" -lt 10 ]; then
              echo "FAIL_KIND=artifact-missing" >> "$GITHUB_ENV"
              echo "FAIL_DETAIL=${HW}: found ${#SHARDS[@]} shard CSV(s), expected 10" >> "$GITHUB_ENV"
              echo "::error::${HW}: found ${#SHARDS[@]} shard CSV(s), expected 10."
              exit 1
            fi
            # --out writes the combined CSV where the commit step globs it.
            python3 eltwise_support_probe.py --merge "${SHARDS[@]}" \
              --out "_artifact/${HW}/eltwise_support_matrix.csv"
            SRC=$(ls _artifact/${HW}/eltwise_support_matrix.csv 2>/dev/null | head -1 || true)
            if [ -z "$SRC" ] || [ ! -s "$SRC" ]; then
              echo "FAIL_KIND=merge-failed" >> "$GITHUB_ENV"
              echo "FAIL_DETAIL=${HW}: merge produced no/empty eltwise_support_matrix.csv" >> "$GITHUB_ENV"
              echo "::error::${HW}: merge produced no/empty eltwise_support_matrix.csv."
              exit 1
            fi
            echo "📦 ${HW}: merged ${#SHARDS[@]} shards -> $SRC ($(wc -c <"$SRC") bytes)"
          done

      # 5 + 6. Commit both boards under data/workflow/<hw>/ in ONE PR (App
      #        token), approve (WRITE_ACCESS_PAT), enable squash auto-merge (App).
      - name: Mint App token
        id: app
        if: steps.plan.outputs.ingest == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Commit results + open auto-merging PR
        id: commit
        if: steps.plan.outputs.ingest == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}          # bot authors the PR
          APPROVE_TOKEN: ${{ secrets.WRITE_ACCESS_PAT }}     # different identity approves
          GUARD_DATE: ${{ steps.guard.outputs.date }}       # normal-mode date (today IST)
          MODE: ${{ steps.mode.outputs.mode }}
          RESOLVED_RUN_ID: ${{ steps.resolve.outputs.run_id }}
          GH_TT_TOKEN: ${{ secrets.TT_METAL_PAT }}          # to read the tt-metal run's createdAt
        run: |
          set -euo pipefail
          git config user.name "aswincloud-bot[bot]"
          git config user.email "aswincloud-bot[bot]@users.noreply.github.com"

          # DATE: normal mode = today-in-IST (guard). In recover/safety-net the
          # run may be ingested a day later, so "today" is wrong — and unlike the
          # perf JSON, the support CSV carries NO date column to read back. Derive
          # the business date from the tt-metal run's createdAt converted to IST
          # (a 20:00-UTC dispatch → 01:30 IST next day, matching the scheduled
          # label). Slice via `date +%F` in Asia/Kolkata.
          DATE="$GUARD_DATE"
          if [ "$MODE" != "normal" ]; then
            CREATED=$(GH_TOKEN="$GH_TT_TOKEN" gh run view "$RESOLVED_RUN_ID" -R "$TT_REPO" \
                        --json createdAt -q .createdAt)
            DATE=$(TZ='Asia/Kolkata' date -d "$CREATED" +%F)
            echo "🗓️  recover/safety-net date from run createdAt ($CREATED) → IST $DATE (guard was $GUARD_DATE)"
          fi

          # Safety-net-only staleness guard: the safety-net fires because TODAY's
          # data is missing, and Resolve auto-picks the newest *successful* run.
          # If today's tt-metal run ALSO failed, that newest-success is a PRIOR
          # day whose root+history CSV already match → the commit below is a no-op
          # and exits 0 SILENTLY, leaving today missing with no alert. Detect that
          # (derived DATE != today) and fail loudly so the notify fires. (Manual
          # `recover` is exempt: backfilling an older run by id is legitimate.)
          if [ "$MODE" = "safety-net" ] && [ "$DATE" != "$GUARD_DATE" ]; then
            echo "FAIL_KIND=safety-net-no-run-today" >> "$GITHUB_ENV"
            echo "FAIL_DETAIL=newest successful run is ${DATE}, not today (${GUARD_DATE}); today's run likely failed — nothing to recover automatically" >> "$GITHUB_ENV"
            echo "::error::Safety-net: no successful tt-metal run for ${GUARD_DATE} (newest is ${DATE}). Today's run failed — needs a manual dispatch/recover."
            exit 1
          fi

          BRANCH="workflow/support-${DATE}-${{ github.run_id }}"
          git checkout -b "$BRANCH"

          # For each board write BOTH: the per-board root CSV (the dashboard's
          # source of truth, overwritten each run) AND a dated copy under
          # history/workflow/. process.py's compute_changes() diffs a board's
          # root CSV against its previous dated history, and REQUIRES the newest
          # dated file to equal the root — so these must be written together.
          for HW in $BOARDS; do
            SUBDIR=$(printf '%s' "$HW" | tr '[:upper:]' '[:lower:]')
            SRC=$(ls _artifact/${HW}/eltwise_support_matrix.csv | head -1)

            ROOT_CSV="eltwise_support_matrix_${SUBDIR}.csv"
            cp "$SRC" "$ROOT_CSV"
            git add "$ROOT_CSV"

            mkdir -p history/workflow
            HIST_CSV="history/workflow/eltwise_support_matrix_${SUBDIR}_${DATE}.csv"
            cp "$SRC" "$HIST_CSV"
            git add "$HIST_CSV"
          done
          # public/data.js is regenerated from these root CSVs by process.py at
          # deploy (CF Workers Builds) — it stays gitignored, never committed.

          if git diff --cached --quiet; then
            echo "Nothing to commit (identical files already present); skipping PR."
            # No data landed -> the change notifier below must not run.
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: eltwise support matrix ${DATE} (per-board: N150+P100a)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${OUR_REPO}.git" "$BRANCH"

          # Note the ingest mode so a recovered/backfilled day is distinguishable
          # from a fresh daily run in the PR history.
          ORIGIN="Automated daily"
          [ "$MODE" != "normal" ] && ORIGIN="Recovered (${MODE})"
          PR_URL=$(gh pr create -R "$OUR_REPO" --base main --head "$BRANCH" \
            --title "data: eltwise support matrix ${DATE} (per-board: N150+P100a)" \
            --body "${ORIGIN} tt-metal eltwise support-probe run — one build, 2 boards (N150+P100a viommu) x 10 shards. Updates each board's root \`eltwise_support_matrix_<board>.csv\` (the dashboard source) plus a dated copy under \`history/workflow/\`.")
          echo "Opened $PR_URL"
          # Data landed -> let the change notifier run, and give it the PR link.
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          # The membership-gated auto-approve workflow won't fire for a bot
          # author, so approve inline with a different write identity
          # (WRITE_ACCESS_PAT = Aswincloud-Bot, a codeowners-bypass member).
          GH_TOKEN="$APPROVE_TOKEN" gh pr review "$PR_URL" -R "$OUR_REPO" --approve \
            --body "Auto-approving daily support data PR (generated: per-board root eltwise_support_matrix_<board>.csv + history/workflow/ snapshots)."

          # Bare --auto only: the repo's merge queue sets the merge strategy and
          # rejects both --squash ("merge strategy set by merge queue") and
          # --delete-branch ("Cannot use --delete-branch when merge queue
          # enabled"); the queue squashes and deletes the head branch itself.
          gh pr merge "$PR_URL" -R "$OUR_REPO" --auto
          echo "✅ Auto-merge enabled; merge queue will land it once checks pass."

      # 6a. Tell Slack when today's data actually DIFFERS from the previous run.
      #     The diff is not recomputed here: scripts/changes_summary.py calls
      #     process.py's compute_changes() — the same function behind the
      #     dashboard's "Changes" view — so the alert can never disagree with it.
      #     Runs right after the commit step because the tree now holds today's
      #     root CSV *and* today's dated snapshot, which is exactly the
      #     today-vs-yesterday pair compute_changes() expects (newest history
      #     snapshot == root CSV). Most days are a no-op: over the 15 days to
      #     2026-08-17 only two had any change at all.
      - name: Notify Slack on data change
        if: steps.commit.outputs.committed == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C09CV1RTNJC                        # same channel as the failure notifier
          # The commit step's DATE, not guard's: in recover/safety-net mode it
          # derives the real business date from the tt-metal run's createdAt.
          DATE: ${{ steps.commit.outputs.date }}
          MODE: ${{ steps.mode.outputs.mode }}
          PR_URL: ${{ steps.commit.outputs.pr_url }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
            echo "SLACK_BOT_TOKEN not set — skipping change notification."
            exit 0
          fi

          # Emits {changed, total, text, mrkdwn, dashboard, boards[...]} and always
          # exits 0, so we branch on .changed rather than on an exit code.
          python3 scripts/changes_summary.py > /tmp/changes.json
          if [ "$(jq -r .changed /tmp/changes.json)" != "true" ]; then
            echo "No changes vs the previous run — skipping Slack notification."
            jq -r .mrkdwn /tmp/changes.json
            exit 0
          fi
          TOTAL=$(jq -r .total /tmp/changes.json)
          echo "${TOTAL} change(s) vs the previous run — notifying Slack."

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          MODE_NOTE=""
          [ "${MODE:-normal}" != "normal" ] && MODE_NOTE="Ingested via *${MODE}* mode."

          # The mrkdwn body is built in Python (json.dumps escapes the op names it
          # embeds for free); jq only splices in the links. Never hand-roll JSON
          # around this text in bash. The body deliberately carries no
          # pcc_or_reason/TT_FATAL text — counts and op names only, so a message
          # stays short and can't smuggle a C++ backtrace into the payload.
          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg date    "${DATE:-n/a}" \
            --arg runurl  "$RUN_URL" \
            --arg prurl   "${PR_URL:-}" \
            --arg modenote "$MODE_NOTE" \
            --slurpfile c /tmp/changes.json '
            ( $c[0] ) as $ch |
            ( $ch.mrkdwn
              + (if $modenote != "" then "\n\n" + $modenote else "" end)
              + "\n\n<" + $ch.dashboard + "|open dashboard>"
              + (if $prurl != "" then " · <" + $prurl + "|data PR>" else "" end)
              + " · <" + $runurl + "|pipeline run>"
            ) as $body |
            { channel: $channel,
              text: ("📊 " + $ch.text + " (" + $date + ")"),
              blocks: [
                {type:"header", text:{type:"plain_text",
                 text:("📊 Support matrix changed (" + $date + ")"), emoji:true}},
                {type:"section", text:{type:"mrkdwn", text:$body}}
              ] }')

          # Slack returns HTTP 200 even on logical errors; inspect the JSON "ok".
          RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$PAYLOAD")
          if printf '%s' "$RESP" | grep -q '"ok":true'; then
            echo "✅ Slack notified (${TOTAL} changes)."
          else
            # The data already landed and is merging — a Slack hiccup must not
            # redden the run (that would also trip the failure notifier below).
            echo "::warning::Slack change-notify failed: ${RESP}"
          fi

      # 7. On any failure OR cancellation, file/dedupe an issue assigned to
      #    Aswinmcw. Cancellation is included because a hosted-runner SIGTERM is a
      #    `cancelled()`, not a `failure()`, and used to slip through silently —
      #    even though the dispatched tt-metal run may have succeeded (recoverable).
      - name: File issue on failure
        if: failure() || cancelled()
        uses: actions/github-script@v9
        with:
          script: |
            const cancelled = '${{ job.status }}' === 'cancelled';
            const kind = process.env.FAIL_KIND || (cancelled ? 'cancelled' : 'pipeline-failure');
            const kindLabel = `ttnn-support/${kind}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: kindLabel,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number,
                body: `Recurred ${new Date().toISOString()} — ${runUrl}`,
              });
              core.info(`Commented on existing issue #${open.data[0].number}`);
            } else {
              const detail = kind === 'rebase-conflict'
                ? 'The tt-metal branch hit a **real content conflict** rebasing onto origin/main. **No dispatch was made** — resolve the conflict on `Aswinmcw/test_eltwise_support` manually.'
                : kind === 'rebase-failed'
                ? '`git rebase` failed but **left no conflicting files** — this is a transport/clone error, *not* a merge conflict, so do NOT go hunting for conflicts. Check the git output in the run log; re-running usually clears it.'
                : kind === 'cancelled'
                ? 'The run was **cancelled** (hosted-runner shutdown or manual). The dispatched tt-metal run may have finished successfully — re-run this workflow with **mode=recover** to ingest it (or wait for the 23:45 UTC safety-net).'
                : `Stage: **${kind}**.`;
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Daily eltwise support pipeline ${cancelled ? 'cancelled' : 'failed'}: ${kind}`,
                labels: ['ttnn-support-pipeline', kindLabel, 'automated'],
                assignees: ['Aswinmcw'],
                body: `${detail}\n\nRun: ${runUrl}`,
              });
              core.info('Opened new failure issue.');
            }

      # 8. Ping Slack (C09CV1RTNJC) with the failing stage + a human reason so a
      #    failed day is noticed without watching Actions. Plain chat.postMessage
      #    curl (no third-party action to trust/pin); the SLACK_BOT_TOKEN org
      #    secret needs chat:write and the bot must be IN the channel. Payload is
      #    assembled with `jq --arg` (preinstalled on ubuntu-latest) so the reason
      #    / detail / API-error text are JSON-escaped safely — never hand-roll
      #    JSON around error strings in bash. Skips silently if the token is
      #    absent so it never turns a tokenless run red, and a Slack hiccup only
      #    warns — the issue was already filed above.
      - name: Notify Slack on failure or cancel
        if: failure() || cancelled()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C09CV1RTNJC
          FAIL_KIND: ${{ env.FAIL_KIND }}
          FAIL_DETAIL: ${{ env.FAIL_DETAIL }}
          JOB_STATUS: ${{ job.status }}
          # Prefer the resolved run; fall back to the dispatched one (resolve is
          # skipped on an early cancel, but dispatch may still have produced an id).
          TT_RUN_ID: ${{ steps.resolve.outputs.run_id || steps.dispatch.outputs.run_id }}
          RUN_DATE: ${{ steps.guard.outputs.date }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ]; then
            echo "SLACK_BOT_TOKEN not set — skipping Slack notification."
            exit 0
          fi
          # A cancel sets no FAIL_KIND -> derive 'cancelled' from job status so the
          # message carries a recover hint instead of the generic failure text.
          KIND="${FAIL_KIND:-}"
          if [ -z "$KIND" ] && [ "${JOB_STATUS:-}" = "cancelled" ]; then KIND="cancelled"; fi
          KIND="${KIND:-pipeline-failure}"
          CANCEL_HINT=""
          # Map the machine FAIL_KIND to a one-line human reason.
          case "$KIND" in
            rebase-conflict)    REASON="tt-metal branch rebase hit a REAL content conflict with origin/main — no dispatch made." ;;
            rebase-failed)      REASON="git rebase failed with no conflicting files — transport/clone error, NOT a merge conflict. Re-run usually clears it." ;;
            rebase-push-failed) REASON="Rebase OK but the push was rejected (branch moved underneath us)." ;;
            dispatch-ambiguous) REASON="Multiple new test-dispatch runs appeared — couldn't attribute ours." ;;
            dispatch-not-found) REASON="Dispatched but the tt-metal run could not be located." ;;
            poll-api-error)     REASON="GitHub API kept failing while polling the tt-metal run (outage / bad token)." ;;
            poll-timeout)       REASON="tt-metal run did not complete within 5.5h." ;;
            tt-run-failed)      REASON="The tt-metal run itself failed (all-or-nothing: no data landed)." ;;
            artifact-missing)   REASON="A board was missing shard artifacts (expected 10)." ;;
            merge-failed)       REASON="Shard merge produced no/empty support-matrix CSV." ;;
            resolve-run-not-found)       REASON="Recover: no successful tt-metal run to ingest (and none supplied)." ;;
            recover-run-not-successful)  REASON="Recover: the supplied tt-metal run is not completed/successful." ;;
            safety-net-no-run-today)     REASON="Safety-net: today's tt-metal run failed — no successful run to auto-ingest. Needs a manual dispatch/recover." ;;
            cancelled)          REASON="Run was cancelled (hosted-runner shutdown or manual)."
                                CANCEL_HINT="The dispatched tt-metal run may have finished OK — re-run with *mode=recover* to ingest it, or wait for the 23:45 UTC safety-net." ;;
            pipeline-failure|*) REASON="Pipeline failed at an unlabelled stage." ;;
          esac
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          DATE="${RUN_DATE:-n/a}"
          TT_URL=""
          [ -n "${TT_RUN_ID:-}" ] && TT_URL="https://github.com/${TT_REPO}/actions/runs/${TT_RUN_ID}"
          if [ "$KIND" = "cancelled" ]; then
            HEADER="⚠️ Daily eltwise support-matrix pipeline cancelled"; LEAD=":warning: Daily eltwise support-matrix pipeline cancelled"
          else
            HEADER="🚨 Daily eltwise support-matrix pipeline failed";    LEAD=":rotating_light: Daily eltwise support-matrix pipeline failed"
          fi

          # Assemble the whole mrkdwn body INSIDE jq (not via bash $(...), which
          # strips the trailing newlines and runs the lines together). Optional
          # Detail / cancel-hint / tt-metal-run link are appended only when set.
          PAYLOAD=$(jq -n \
            --arg channel "$SLACK_CHANNEL" \
            --arg reason  "$REASON" \
            --arg kind    "$KIND" \
            --arg detail  "${FAIL_DETAIL:-}" \
            --arg hint    "$CANCEL_HINT" \
            --arg date    "$DATE" \
            --arg runurl  "$RUN_URL" \
            --arg tturl   "$TT_URL" \
            --arg header  "$HEADER" \
            --arg lead    "$LEAD" '
            ( "*Reason:* " + $reason
              + "\n*Stage:* `" + $kind + "`"
              + (if $detail != "" then "\n*Detail:* " + $detail else "" end)
              + (if $hint   != "" then "\n" + $hint else "" end)
              + "\n*Date:* " + $date
              + "\n<" + $runurl + "|pipeline run>"
              + (if $tturl != "" then " · <" + $tturl + "|tt-metal run>" else "" end)
            ) as $body |
            { channel: $channel,
              text: ($lead + " (" + $date + ") — " + $reason),
              blocks: [
                {type:"header", text:{type:"plain_text", text:$header, emoji:true}},
                {type:"section", text:{type:"mrkdwn", text:$body}}
              ] }')

          # Slack returns HTTP 200 even on logical errors; inspect the JSON "ok".
          RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$PAYLOAD")
          if printf '%s' "$RESP" | grep -q '"ok":true'; then
            echo "✅ Slack notified (${KIND})."
          else
            echo "::warning::Slack notify failed: ${RESP}"
          fi
